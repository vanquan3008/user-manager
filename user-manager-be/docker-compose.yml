services:
  postgres:
    image: postgres:16-alpine
    container_name: user-manager-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-UserAuthentication}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - userauth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d UserAuthentication"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - user-manager-network

  user-manager-api:
    build:
      context: .
      dockerfile: UserService.Api/Dockerfile
    container_name: user-manager-api
    ports:
      - "${API_PORT}:8080"
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS:  http://+:8080
      AppSettings__ApplicationName: ${APP_NAME:-User Manager API}
      AppSettings__Version: ${APP_VERSION:-1.0.0}
      AppSettings__Environment: ${APP_ENVIRONMENT:-Development}
      AppSettings__IsAutoMigrate: ${AUTO_MIGRATE:-true}
      AppSettings__ApiPublicBaseUrl: ${API_PUBLIC_BASE_URL:-http://localhost:5004}
      AppSettings__BaseUrl: ${FRONTEND_BASE_URL:-http://localhost:4200}
      ConnectionStrings__UserDatabase: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-UserAuthentication};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};SslMode=Disable"
      AppSettings__Database__EnableSensitiveDataLogging: ${DB_SENSITIVE_LOGGING:-false}
      AppSettings__Database__EnableDetailedErrors: ${DB_DETAILED_ERRORS:-false}
      AppSettings__Jwt__SecretKey: ${JWT_SECRET_KEY:-change-this-secret-key-minimum-32-characters-required}
      AppSettings__Jwt__Issuer: ${JWT_ISSUER:-UserManagerService}
      AppSettings__Jwt__Audience: ${JWT_AUDIENCE:-UserManagerApp}
      AppSettings__Jwt__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION:-60}
      AppSettings__Jwt__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION:-7}
      AppSettings__Cors__AllowedOrigins__0: ${CORS_ALLOWED_ORIGIN_1:-http://localhost:4200}
      AppSettings__Cors__AllowedOrigins__1: ${CORS_ALLOWED_ORIGIN_2:-}
      AppSettings__Cors__AllowCredentials: ${CORS_ALLOW_CREDENTIALS:-true}
      AppSettings__RateLimit__RequestLimit: ${RATE_LIMIT_REQUESTS:-100}
      AppSettings__RateLimit__WindowSeconds: ${RATE_LIMIT_WINDOW:-60}
      AppSettings__OAuth__AllowedRedirectUriHosts__0: ${OAUTH_ALLOWED_HOST_1:-localhost}
      AppSettings__OAuth__AllowedRedirectUriHosts__1: ${OAUTH_ALLOWED_HOST_2:-}
      AppSettings__OAuth__DefaultApplicationAllowedRedirectUris__0: ${OAUTH_DEFAULT_REDIRECT_URI_1:-http://localhost:4200/auth/callback}
      AppSettings__OAuth__DefaultApplicationAllowedRedirectUris__1: ${OAUTH_DEFAULT_REDIRECT_URI_2:-https://localhost:4200/auth/callback}
      AppSettings__OAuth__DefaultApplicationAllowedRedirectUris__2: ${OAUTH_DEFAULT_REDIRECT_URI_3:-http://localhost:4200/oauth/callback}
      AppSettings__OAuth__DefaultApplicationAllowedRedirectUris__3: ${OAUTH_DEFAULT_REDIRECT_URI_4:-https://localhost:4200/oauth/callback}
      AppSettings__OAuth__AllowHttpForLocalhost: ${OAUTH_ALLOW_HTTP_LOCALHOST:-true}
      AppSettings__Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      AppSettings__Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      AppSettings__Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
      EmailSettings__ApplicationDisplayName: ${EMAIL_DISPLAY_NAME:-User Manager}
      EmailSettings__Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      EmailSettings__Smtp__Port: ${SMTP_PORT:-587}
      EmailSettings__Smtp__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      EmailSettings__Smtp__Username: ${SMTP_USERNAME:-}
      EmailSettings__Smtp__Password: ${SMTP_PASSWORD:-}
      EmailSettings__Smtp__Timeout: ${SMTP_TIMEOUT:-30000}
      # Email Sender
      EmailSettings__Sender__FromEmail: ${EMAIL_FROM:-noreply@example.com}
      EmailSettings__Sender__FromName: ${EMAIL_FROM_NAME:-User Manager}
      EmailSettings__Sender__ReplyToEmail: ${EMAIL_REPLY_TO:-support@example.com}
      # Email Templates
      EmailSettings__Templates__BaseUrl: ${EMAIL_TEMPLATE_BASE_URL:-http://localhost:4200}
      EmailSettings__Templates__LogoUrl: ${EMAIL_TEMPLATE_LOGO_URL:-http://localhost:4200/logo.png}
      EmailSettings__Templates__PrimaryColor: ${EMAIL_TEMPLATE_PRIMARY_COLOR:-#3B82F6}
      # OpenIddict
      OpenIddict__ClientSecret: ${OPENIDDICT_CLIENT_SECRET}
      # Admin User
      Admin__Email: ${ADMIN_EMAIL}
      Admin__Password: ${ADMIN_PASSWORD}
      # Seeding Test Users
      SEED_TEST_USER_NAME: ${SEED_TEST_USER_NAME:-testuser}
      SEED_TEST_USER_EMAIL: ${SEED_TEST_USER_EMAIL:-testuser@example.com}
      SEED_TEST_USER_PASSWORD: ${SEED_TEST_USER_PASSWORD:-Password123!}
      SEED_SSO_USER_NAME: ${SEED_SSO_USER_NAME:-ssouser}
      SEED_SSO_USER_EMAIL: ${SEED_SSO_USER_EMAIL:-ssouser@example.com}
      SEED_SSO_USER_PASSWORD: ${SEED_SSO_USER_PASSWORD:-Password123!}
      # Seeding Application
      SEED_APP_NAME: ${SEED_APP_NAME:-user-manager}
      SEED_APP_DESCRIPTION: ${SEED_APP_DESCRIPTION:-User Management Application for SSO}
      SEED_APP_API_KEY: ${SEED_APP_API_KEY:-user-manager}
      
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - user-manager-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  userauth_pgdata:
    driver: local

networks:
  user-manager-network:
    driver: bridge
