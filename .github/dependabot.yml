version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/user-manager-be"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/user-manager-fe"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-all-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5