version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/user-manager-be"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft-packages:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
          - "Microsoft.Extensions*"
          - "Microsoft.AspNetCore*"
          - "Npgsql.EntityFrameworkCore.PostgreSQL*"

  - package-ecosystem: "npm"
    directory: "/user-manager-fe"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular-packages:
        patterns:
          - "@angular/*"
          - "zone.js"
          - "rxjs"
          - "typescript"
      testing-packages:
        patterns:
          - "jasmine*"
          - "@types/jasmine*"
          - "karma*"
      style-packages:
        patterns:
          - "tailwindcss"
          - "postcss"
          - "autoprefixer"
    ignore:
      # Chặn tất cả các bản nâng cấp lớn (Major) cho NPM để tránh lỗi build
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5