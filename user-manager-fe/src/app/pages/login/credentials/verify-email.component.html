<div class="h-full overflow-y-auto">
<div
  class="flex min-h-full items-center justify-center px-4 py-8 transition-colors duration-300"
  [ngClass]="
    theme() === 'dark'
      ? 'bg-slate-950 bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950'
      : 'bg-gradient-to-br from-blue-500 via-sky-300 to-blue-100'
  "
>
  <div
    class="w-full max-w-md overflow-hidden rounded-xl border shadow-2xl backdrop-blur-sm"
    [ngClass]="
      theme() === 'dark'
        ? 'border-slate-700/80 bg-slate-950/70 shadow-slate-950/80'
        : 'border-blue-200/70 bg-white/80 shadow-blue-900/20'
    "
  >
    <div class="p-8" [ngClass]="theme() === 'dark' ? 'bg-slate-950/80' : 'bg-white/95'">
      <h1
        class="text-xl font-semibold tracking-tight"
        [ngClass]="theme() === 'dark' ? 'text-slate-50' : 'text-slate-900'"
      >
        Xác thực email
      </h1>
      <p class="mt-1 text-sm" [ngClass]="theme() === 'dark' ? 'text-slate-400' : 'text-slate-600'">
        Đang kiểm tra link xác thực…
      </p>

      @if (loading()) {
        <div class="mt-6 flex items-center gap-3">
          <span class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-sky-500/30 border-t-sky-500"></span>
          <span class="text-sm" [ngClass]="theme() === 'dark' ? 'text-slate-300' : 'text-slate-600'">
            Vui lòng chờ trong giây lát.
          </span>
        </div>
      }

      @if (!loading() && error()) {
        <div
          class="mt-4 rounded-lg border px-3 py-2 text-sm"
          [ngClass]="
            theme() === 'dark'
              ? 'border-rose-500/80 bg-rose-950/60 text-rose-200'
              : 'border-rose-300 bg-rose-50 text-rose-700'
          "
        >
          {{ error() }}
        </div>
        <a
          routerLink="/login"
          class="mt-4 inline-block text-sm underline-offset-2 hover:underline"
          [ngClass]="theme() === 'dark' ? 'text-sky-300' : 'text-sky-600'"
        >
          Quay lại đăng nhập
        </a>
      }

      @if (!loading() && success()) {
        <div
          class="mt-4 flex items-start gap-2 rounded-lg border px-3 py-2 text-sm"
          [ngClass]="
            theme() === 'dark'
              ? 'border-emerald-500/70 bg-emerald-900/40 text-emerald-100'
              : 'border-emerald-400 bg-emerald-50 text-emerald-700'
          "
        >
          <span class="mt-0.5 h-2 w-2 shrink-0 rounded-full bg-emerald-400"></span>
          <span>Email của bạn đã được xác thực. Bạn có thể đăng nhập.</span>
        </div>
        <a
          routerLink="/login"
          class="mt-4 inline-flex items-center justify-center rounded-lg px-4 py-2.5 text-sm font-medium text-white shadow-sm transition"
          [ngClass]="
            theme() === 'dark'
              ? 'bg-gradient-to-r from-sky-500 to-indigo-500 hover:from-sky-400 hover:to-indigo-400'
              : 'bg-gradient-to-r from-sky-500 to-blue-500 hover:from-sky-400 hover:to-blue-400'
          "
        >
          Đăng nhập
        </a>
      }
    </div>
  </div>

  <button
    type="button"
    class="fixed bottom-6 right-6 flex h-11 w-11 cursor-pointer items-center justify-center rounded-full border shadow-xl transition hover:-translate-y-0.5"
    [ngClass]="
      theme() === 'dark'
        ? 'border-amber-300/70 bg-gradient-to-br from-amber-400 to-orange-500'
        : 'border-amber-300 bg-gradient-to-br from-yellow-300 to-orange-400'
    "
    (click)="toggleTheme()"
  >
    <span class="text-lg">{{ theme() === 'light' ? '☀' : '🌙' }}</span>
  </button>
</div>
</div>
