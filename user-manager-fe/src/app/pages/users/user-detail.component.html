<div class="main main-layout">
  <div class="app-toolbar-row flex flex-wrap items-center gap-2">
    <a
      routerLink="/users"
      class="inline-flex items-center gap-1.5 text-sm font-medium transition"
      [ngClass]="theme() === 'light' ? 'text-slate-600 hover:text-slate-900' : 'text-slate-400 hover:text-slate-100'"
    >
      <span class="material-symbols-outlined text-lg">arrow_back</span>
      Users
    </a>
  </div>

  @if (loading()) {
    <app-loading-state message="Loading user access details..." [theme]="theme()" />
  } @else if (error()) {
    <div
      class="rounded-3xl border px-5 py-4 text-sm"
      [ngClass]="theme() === 'light' ? 'border-rose-200 bg-rose-50 text-rose-800' : 'border-rose-500/30 bg-rose-950/40 text-rose-100'"
    >
      {{ error() }}
    </div>
  } @else {
    @let viewModel = userWithRoles();
    @if (viewModel) {
    <app-user-access-overview
      [user]="viewModel.user"
      [assignedRoleCount]="assignedRoles().length"
      [ssoAppCount]="ssoApplications().length"
      [accountTypeLabel]="accountTypeLabel()"
      [availabilityLabel]="availabilityLabel()"
      [theme]="theme()"
    />

    @if (actionMessage()) {
      <div
        class="rounded-3xl border px-5 py-4 text-sm"
        [ngClass]="theme() === 'light' ? 'border-sky-200 bg-sky-50 text-sky-800' : 'border-sky-500/30 bg-sky-950/40 text-sky-100'"
      >
        {{ actionMessage() }}
      </div>
    }

    <app-user-role-management
      [roles]="assignedRoles()"
      [roleOptions]="roleOptions()"
      [selectedRole]="selectedRole()"
      [addingRole]="addingRole()"
      [removingRole]="removingRole()"
      [theme]="theme()"
      (selectedRoleChange)="selectedRole.set($event)"
      (addRole)="addRole()"
      (removeRole)="removeRole($event)"
    />

    @if (isSsoUser()) {
      <app-user-sso-access
        [applications]="ssoApplications()"
        [applicationOptions]="applicationOptions()"
        [roleOptions]="appRoleOptions()"
        [selectedApplicationId]="grantAppId()"
        [selectedRole]="grantRole()"
        [granting]="granting()"
        [revoking]="revoking()"
        [hasAvailableApplications]="allApplications().length > 0"
        [theme]="theme()"
        (selectedApplicationIdChange)="onGrantAppChange($event)"
        (selectedRoleChange)="grantRole.set($event)"
        (grant)="grantSsoApplication()"
        (revoke)="revokeSsoApplication($event)"
      />
    }
    }
  }
</div>
