@if (vm().open && vm().options; as o) {
  <div class="overlay-backdrop" (click)="cancel()" aria-hidden="true"></div>
  <div class="dialog-panel" role="alertdialog" aria-modal="true" [attr.aria-labelledby]="'confirm-title'" (keydown.escape)="cancel()">
    <div class="flex items-start gap-4">
      <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full"
           [class]="o.variant === 'danger' ? 'bg-bad-soft text-bad' : 'bg-brand-soft text-brand-text'">
        <span class="material-symbols-outlined">{{ icon() }}</span>
      </div>
      <div class="min-w-0 flex-1">
        <h2 id="confirm-title" class="text-base font-semibold">{{ o.title }}</h2>
        <p class="mt-1.5 text-sm leading-relaxed text-fg-2">{{ o.message }}</p>
      </div>
    </div>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" class="btn-secondary" (click)="cancel()">{{ o.cancelText }}</button>
      <button type="button" [class]="o.variant === 'danger' ? 'btn-danger' : 'btn-primary'" (click)="accept()" cdkFocusInitial autofocus>
        {{ o.confirmText }}
      </button>
    </div>
  </div>
}
