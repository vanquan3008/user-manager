@if (vm().open && vm().options; as o) {
  <div class="fixed inset-0 z-[99998] flex items-center justify-center px-4">
    <!-- Backdrop -->
    <button
      type="button"
      class="absolute inset-0 cursor-default"
      (click)="cancel()"
      [ngClass]="theme() === 'light' ? 'bg-slate-900/40' : 'bg-black/60'"
      aria-label="Close"
    ></button>

    <!-- Dialog -->
    <div
      class="relative z-[99999] w-full max-w-[520px] rounded-2xl border p-5 shadow-2xl"
      [ngClass]="theme() === 'light'
        ? 'border-slate-200 bg-white text-slate-900'
        : 'border-slate-700 bg-slate-900/90 text-slate-100'"
      role="dialog"
      aria-modal="true"
    >
      <div class="flex items-start gap-4">
        <div
          class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl border"
          [ngClass]="o.variant === 'danger'
            ? (theme() === 'light' ? 'border-rose-200 bg-rose-50 text-rose-600' : 'border-rose-500/40 bg-rose-500/10 text-rose-200')
            : (theme() === 'light' ? 'border-sky-200 bg-sky-50 text-sky-600' : 'border-sky-500/40 bg-sky-500/10 text-sky-200')"
        >
          <span class="material-symbols-outlined text-[22px]">{{ icon() }}</span>
        </div>

        <div class="min-w-0 flex-1">
          <div class="text-base font-semibold">{{ o.title }}</div>
          <div class="mt-1 text-sm leading-relaxed" [ngClass]="theme() === 'light' ? 'text-slate-600' : 'text-slate-300'">
            {{ o.message }}
          </div>
        </div>
      </div>

      <div class="mt-5 flex items-center justify-end gap-2">
        <button
          type="button"
          class="inline-flex items-center justify-center rounded-xl border px-4 py-2 text-sm font-medium transition"
          [ngClass]="theme() === 'light'
            ? 'border-slate-200 bg-white text-slate-700 hover:bg-slate-50'
            : 'border-slate-700 bg-slate-800/60 text-slate-200 hover:bg-slate-700/60'"
          (click)="cancel()"
        >
          {{ o.cancelText }}
        </button>

        <button
          type="button"
          class="inline-flex items-center justify-center rounded-xl px-4 py-2 text-sm font-semibold transition"
          [ngClass]="o.variant === 'danger'
            ? (theme() === 'light' ? 'bg-rose-600 text-white hover:bg-rose-700' : 'bg-rose-600 text-white hover:bg-rose-500')
            : (theme() === 'light' ? 'bg-sky-600 text-white hover:bg-sky-700' : 'bg-sky-600 text-white hover:bg-sky-500')"
          (click)="accept()"
        >
          {{ o.confirmText }}
        </button>
      </div>
    </div>
  </div>
}
