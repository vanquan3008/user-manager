<div class="app-searchable-multi relative w-full">
  <div
    class="flex min-h-11 w-full items-stretch rounded-lg border outline-none transition duration-200 focus-within:ring-2 focus-within:ring-sky-500/30"
    [ngClass]="{
      'border-slate-200 bg-white': theme() === 'light',
      'border-slate-600 bg-slate-800/80': theme() === 'dark',
      'pointer-events-none opacity-60': isDisabled(),
      'hover:border-sky-400/60 hover:shadow-[0_18px_36px_-24px_rgba(14,165,233,0.45)]': !isDisabled(),
      'ring-2 ring-sky-500/30 shadow-[0_20px_36px_-28px_rgba(14,165,233,0.45)]': open()
    }"
  >
    <div class="min-w-0 flex-1">
      @if (open()) {
        <input
          #filterInput
          type="text"
          class="h-full w-full min-h-11 border-0 bg-transparent px-4 py-2.5 text-sm outline-none"
          [ngClass]="{
            'text-slate-800 placeholder:text-slate-400': theme() === 'light',
            'text-slate-100 placeholder:text-slate-500': theme() === 'dark'
          }"
          [ngModel]="query()"
          (ngModelChange)="query.set($event)"
          [placeholder]="searchPlaceholder()"
          (focus)="onMainFocus()"
          [disabled]="isDisabled()"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        />
      } @else {
        <input
          type="text"
          readonly
          class="h-full w-full min-h-11 cursor-pointer border-0 bg-transparent px-4 py-2.5 text-sm outline-none"
          [ngClass]="{
            'text-slate-800 placeholder:text-slate-400': theme() === 'light',
            'text-slate-100 placeholder:text-slate-500': theme() === 'dark'
          }"
          [value]="summaryText()"
          [attr.placeholder]="placeholder()"
          (focus)="onMainFocus()"
          (click)="onMainFocus()"
          [disabled]="isDisabled()"
        />
      }
    </div>
    <button
      type="button"
      class="flex shrink-0 items-center border-l px-3 outline-none transition"
      [ngClass]="{
        'cursor-not-allowed': isDisabled(),
        'cursor-pointer hover:bg-slate-100/80': !isDisabled() && theme() === 'light',
        'cursor-pointer hover:bg-slate-700/50': !isDisabled() && theme() === 'dark',
        'border-slate-200': theme() === 'light',
        'border-slate-600': theme() === 'dark'
      }"
      [disabled]="isDisabled()"
      (click)="toggleChevron($event)"
      tabindex="-1"
    >
      <span
        class="material-symbols-outlined text-xl transition-transform duration-200"
        [ngClass]="{ 'rotate-180': open(), 'text-slate-500': theme() === 'light', 'text-slate-400': theme() === 'dark' }"
      >
        expand_more
      </span>
    </button>
  </div>

  @if (open()) {
    <div
      class="app-dropdown-panel motion-card absolute left-0 right-0 top-full z-[9999] mt-1.5 max-h-[min(60vh,280px)] min-w-0 overflow-y-auto overflow-x-hidden overscroll-contain rounded-lg border p-1 shadow-2xl backdrop-blur"
      [ngClass]="theme() === 'light' ? 'border-slate-200 bg-white/95' : 'border-slate-600 bg-slate-800/95'"
      (click)="$event.stopPropagation()"
    >
      @for (opt of filteredOptions(); track opt.value) {
        <button
          type="button"
          class="flex w-full items-start rounded-xl px-4 py-2.5 text-left text-sm transition duration-150"
          [ngClass]="{
            'bg-sky-50 text-sky-800 ring-1 ring-sky-200/80': isSelected(opt.value) && theme() === 'light',
            'bg-sky-500/20 text-sky-100 ring-1 ring-sky-400/30': isSelected(opt.value) && theme() === 'dark',
            'text-slate-800 hover:bg-slate-100': !isSelected(opt.value) && theme() === 'light',
            'text-slate-200 hover:bg-slate-700/60': !isSelected(opt.value) && theme() === 'dark'
          }"
          (click)="toggleOption(opt.value, $event)"
        >
          <span class="min-w-0">
            <span class="block font-mono text-xs font-medium">{{ opt.label }}</span>
            @if (opt.description) {
              <span class="mt-0.5 block text-xs opacity-80" [ngClass]="theme() === 'light' ? 'text-slate-600' : 'text-slate-400'">{{
                opt.description
              }}</span>
            }
          </span>
        </button>
      } @empty {
        <div class="px-4 py-3 text-sm" [ngClass]="theme() === 'light' ? 'text-slate-500' : 'text-slate-400'">Không có kết quả.</div>
      }
    </div>
  }
</div>
