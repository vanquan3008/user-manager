<div class="app-searchable-multi relative w-full">
  <div class="flex w-full items-stretch overflow-hidden rounded-lg border bg-surface shadow-xs transition focus-within:border-brand focus-within:ring-4 focus-within:ring-brand/15"
       [class]="open() ? 'border-brand ring-4 ring-brand/15' : 'border-line-strong'" [class.opacity-60]="isDisabled()" [class.pointer-events-none]="isDisabled()">
    <div class="min-w-0 flex-1">
      @if (open()) {
        <input #filterInput type="text" class="h-9 w-full border-0 bg-transparent px-3 text-sm text-fg outline-none placeholder:text-fg-3"
          [ngModel]="query()" (ngModelChange)="query.set($event)" [placeholder]="searchPlaceholder()"
          (focus)="onMainFocus()" [disabled]="isDisabled()" autocomplete="off" autocorrect="off" spellcheck="false" />
      } @else {
        <input type="text" readonly class="h-9 w-full cursor-pointer border-0 bg-transparent px-3 text-sm text-fg outline-none placeholder:text-fg-3"
          [value]="summaryText()" [attr.placeholder]="placeholder()" (focus)="onMainFocus()" (click)="onMainFocus()" [disabled]="isDisabled()" />
      }
    </div>
    <button type="button" class="flex shrink-0 items-center border-l border-line px-2.5 text-fg-3 transition hover:bg-surface-2"
      [disabled]="isDisabled()" (click)="toggleChevron($event)" tabindex="-1" aria-label="Toggle options">
      <span class="material-symbols-outlined text-[18px] transition-transform duration-150" [class.rotate-180]="open()">expand_more</span>
    </button>
  </div>

  @if (open()) {
    <div class="app-dropdown-panel absolute left-0 right-0 top-full z-[60] mt-1 max-h-[min(60vh,280px)] overflow-y-auto overscroll-contain rounded-xl border border-line bg-surface p-1 shadow-pop animate-scale-in"
         (click)="$event.stopPropagation()" role="listbox" aria-multiselectable="true">
      @for (opt of filteredOptions(); track opt.value) {
        <button type="button" role="option" [attr.aria-selected]="isSelected(opt.value)"
          class="flex w-full items-start justify-between gap-2 rounded-lg px-2.5 py-2 text-left text-sm transition-colors"
          [class]="isSelected(opt.value) ? 'bg-brand-soft text-brand-text' : 'text-fg hover:bg-surface-2'"
          (click)="toggleOption(opt.value, $event)">
          <span class="min-w-0">
            <span class="block font-mono text-xs font-medium">{{ opt.label }}</span>
            @if (opt.description) { <span class="mt-0.5 block text-xs text-fg-3">{{ opt.description }}</span> }
          </span>
          @if (isSelected(opt.value)) { <span class="material-symbols-outlined shrink-0 text-[18px]">check</span> }
        </button>
      } @empty {
        <div class="px-3 py-2.5 text-sm text-fg-3">No matches.</div>
      }
    </div>
  }
</div>
