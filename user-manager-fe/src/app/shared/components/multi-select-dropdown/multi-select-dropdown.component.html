<div #hostRoot class="app-multi-dropdown relative w-full">
  <button #triggerBtn type="button" class="input flex items-center justify-between gap-2 text-left"
    [ngClass]="open() ? 'border-brand ring-4 ring-brand/15' : ''"
    [disabled]="isDisabled()" (click)="onTriggerClick($event)" [attr.aria-expanded]="open()" aria-haspopup="listbox">
    <span class="min-w-0 flex-1 truncate" [class.text-fg-3]="!triggerSummary()">{{ triggerSummary() || placeholder() }}</span>
    <span class="material-symbols-outlined shrink-0 text-[18px] text-fg-3 transition-transform duration-150" [class.rotate-180]="open()">expand_more</span>
  </button>

  <div #dropdownPanel role="listbox" aria-multiselectable="true" [hidden]="!open()"
    class="app-multi-dropdown-panel fixed z-[10050] min-w-0 overflow-y-auto overscroll-contain rounded-xl border border-line bg-surface p-1 shadow-pop animate-scale-in"
    [ngStyle]="panelStyle() ?? {}">
    @for (opt of options(); track opt.value) {
      <button type="button" role="option" [attr.aria-selected]="isSelected(opt.value)"
        class="flex w-full items-center justify-between gap-2 rounded-lg px-2.5 py-2 text-left text-sm transition-colors"
        [class]="isSelected(opt.value) ? 'bg-brand-soft text-brand-text' : (opt.variant === 'warning' ? 'text-warn hover:bg-warn-soft' : 'text-fg hover:bg-surface-2')"
        (click)="toggleOption(opt, $event)">
        <span class="min-w-0 flex-1 truncate">{{ opt.label }}</span>
        @if (isSelected(opt.value)) { <span class="material-symbols-outlined shrink-0 text-[18px]">check</span> }
      </button>
    } @empty {
      <div class="px-3 py-2.5 text-sm text-fg-3">{{ translate.t().noOptions }}</div>
    }
  </div>
</div>
