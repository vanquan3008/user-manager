<div #hostRoot class="app-multi-dropdown relative w-full">
  <button
    #triggerBtn
    type="button"
    class="flex min-h-11 w-full items-center justify-between gap-2 rounded-lg border px-4 py-2.5 text-left text-sm font-medium outline-none transition duration-200 focus-visible:ring-2 focus-visible:ring-sky-500/30"
    [ngClass]="{
      'border-slate-200 bg-white text-slate-800': theme() === 'light',
      'border-slate-600 bg-slate-800/80 text-slate-100': theme() === 'dark',
      'cursor-not-allowed opacity-60': isDisabled(),
      'cursor-pointer hover:-translate-y-px hover:border-sky-400/60 hover:shadow-[0_18px_36px_-24px_rgba(14,165,233,0.45)]': !isDisabled(),
      'ring-2 ring-sky-500/30 -translate-y-px shadow-[0_20px_36px_-28px_rgba(14,165,233,0.45)]': open()
    }"
    [disabled]="isDisabled()"
    (click)="onTriggerClick($event)"
  >
    <span
      class="min-w-0 flex-1 truncate"
      [ngClass]="
        !triggerSummary() && theme() === 'light'
          ? 'text-slate-500'
          : !triggerSummary() && theme() === 'dark'
            ? 'text-slate-400'
            : ''
      "
    >
      {{ triggerSummary() || placeholder() }}
    </span>
    <span
      class="material-symbols-outlined shrink-0 text-xl transition-transform duration-200"
      [ngClass]="{
        'rotate-180': open(),
        'text-slate-500': theme() === 'light',
        'text-slate-400': theme() === 'dark'
      }"
    >
      expand_more
    </span>
  </button>

  <div
    #dropdownPanel
    role="listbox"
    aria-multiselectable="true"
    [hidden]="!open()"
    class="app-multi-dropdown-panel motion-card fixed z-[10050] min-w-0 overflow-y-auto overflow-x-hidden overscroll-contain rounded-lg border p-1 shadow-2xl backdrop-blur"
    [ngClass]="theme() === 'light' ? 'border-slate-200 bg-white/95' : 'border-slate-600 bg-slate-800/95'"
    [ngStyle]="panelStyle() ?? {}"
  >
    @for (opt of options(); track opt.value) {
      <button
        type="button"
        class="flex w-full items-center justify-between gap-2 rounded-xl px-4 py-2.5 text-left text-sm transition duration-150 hover:-translate-y-px"
        [ngClass]="
          isSelected(opt.value) && theme() === 'light'
            ? 'bg-sky-50 text-sky-700 shadow-[0_10px_24px_-20px_rgba(14,165,233,0.55)]'
            : isSelected(opt.value) && theme() === 'dark'
              ? 'bg-sky-500/15 text-sky-300 shadow-[0_12px_24px_-20px_rgba(14,165,233,0.45)]'
              : opt.variant === 'warning' && theme() === 'light'
                ? 'text-amber-900 hover:bg-amber-50/90'
                : opt.variant === 'warning' && theme() === 'dark'
                  ? 'text-amber-200/95 hover:bg-amber-500/10'
                  : theme() === 'light'
                    ? 'text-slate-800 hover:bg-slate-100'
                    : 'text-slate-200 hover:bg-slate-700/60'
        "
        (click)="toggleOption(opt, $event)"
      >
        <span class="min-w-0 flex-1 truncate">{{ opt.label }}</span>
        @if (isSelected(opt.value)) {
          <span class="material-symbols-outlined shrink-0 text-base text-sky-500">check</span>
        }
      </button>
    } @empty {
      <div class="px-4 py-3 text-sm" [ngClass]="theme() === 'light' ? 'text-slate-500' : 'text-slate-400'">
        {{ translate.t().noOptions }}
      </div>
    }
  </div>
</div>
