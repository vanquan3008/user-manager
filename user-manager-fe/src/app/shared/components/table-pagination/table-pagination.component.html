<div class="flex flex-wrap items-center justify-between gap-3 border-t border-line px-4 py-3">
  <p class="text-[13px] tabular-nums text-fg-2">{{ rangeLabel() }}</p>
  <div class="flex flex-wrap items-center gap-3">
    <label class="flex items-center gap-2 text-[13px] text-fg-2">
      <span>{{ translate.t().paginationPerPage }}</span>
      <select class="input h-8 w-[4.5rem] py-0 text-[13px]" [ngModel]="pageSize()" (ngModelChange)="onPageSizeSelect($event)">
        @for (opt of pageSizeOptions(); track opt) { <option [ngValue]="opt">{{ opt }}</option> }
      </select>
    </label>
    <div class="flex items-center gap-1">
      <button type="button" class="btn-secondary btn-sm" [disabled]="!canPrev()" (click)="onPrev()" [attr.aria-label]="translate.t().paginationPrev">
        <span class="material-symbols-outlined">chevron_left</span><span class="hidden sm:inline">{{ translate.t().paginationPrev }}</span>
      </button>
      <span class="min-w-[4.5rem] text-center text-[13px] font-medium tabular-nums text-fg-2">{{ page() }} / {{ totalPages() }}</span>
      <button type="button" class="btn-secondary btn-sm" [disabled]="!canNext()" (click)="onNext()" [attr.aria-label]="translate.t().paginationNext">
        <span class="hidden sm:inline">{{ translate.t().paginationNext }}</span><span class="material-symbols-outlined">chevron_right</span>
      </button>
    </div>
  </div>
</div>
