<div
  class="flex flex-wrap items-center justify-between gap-3 border-t border-[var(--app-card-border)] px-1 py-3"
  [ngClass]="theme() === 'light' ? 'bg-transparent' : 'bg-transparent'"
>
    <p class="text-sm tabular-nums text-[var(--app-text-secondary)]">{{ rangeLabel() }}</p>
    <div class="flex flex-wrap items-center gap-3">
      <label class="flex items-center gap-2 text-sm text-[var(--app-text-secondary)]">
        <span>{{ translate.t().paginationPerPage }}</span>
        <select
          class="rounded-lg border px-2 py-1.5 text-sm outline-none focus:ring-2 focus:ring-sky-500/30"
          [ngClass]="
            theme() === 'light'
              ? 'border-slate-200 bg-white text-slate-800'
              : 'border-slate-600 bg-slate-900/80 text-slate-100'
          "
          [ngModel]="pageSize()"
          (ngModelChange)="onPageSizeSelect($event)"
        >
          @for (opt of pageSizeOptions(); track opt) {
            <option [ngValue]="opt">{{ opt }}</option>
          }
        </select>
      </label>
      <div class="flex items-center gap-2">
        <button
          type="button"
          class="inline-flex items-center gap-1 rounded-lg border px-3 py-1.5 text-sm font-medium transition disabled:pointer-events-none disabled:opacity-40"
          [ngClass]="
            theme() === 'light'
              ? 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'
              : 'border-slate-600 bg-slate-800 text-slate-200 hover:bg-slate-700'
          "
          [disabled]="!canPrev()"
          (click)="onPrev()"
        >
          <span class="material-symbols-outlined text-[18px]">chevron_left</span>
          {{ translate.t().paginationPrev }}
        </button>
        <span class="min-w-[4.5rem] text-center text-xs tabular-nums text-[var(--app-text-secondary)]">
          {{ page() }} / {{ totalPages() }}
        </span>
        <button
          type="button"
          class="inline-flex items-center gap-1 rounded-lg border px-3 py-1.5 text-sm font-medium transition disabled:pointer-events-none disabled:opacity-40"
          [ngClass]="
            theme() === 'light'
              ? 'border-slate-200 bg-slate-50 text-slate-700 hover:bg-slate-100'
              : 'border-slate-600 bg-slate-800 text-slate-200 hover:bg-slate-700'
          "
          [disabled]="!canNext()"
          (click)="onNext()"
        >
          {{ translate.t().paginationNext }}
          <span class="material-symbols-outlined text-[18px]">chevron_right</span>
        </button>
      </div>
    </div>
</div>
