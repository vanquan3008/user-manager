<div
  class="fixed inset-0 z-[9998] transition-all duration-500 ease-out"
  [ngClass]="[
    theme() === 'light' ? 'bg-sky-950/18 backdrop-blur-sm' : 'bg-slate-950/62 backdrop-blur-sm',
    closing() ? 'opacity-0' : 'opacity-100'
  ]"
  (click)="close.emit()"
></div>
<div
  class="fixed right-0 top-0 z-[9999] flex h-screen max-h-[100dvh] w-full max-w-[560px] flex-col overflow-hidden border-l shadow-2xl transition-transform duration-500 ease-out"
  [ngClass]="[
    theme() === 'light' ? 'rounded-l-[2rem] border-sky-100/90 bg-white/97 backdrop-blur-2xl' : 'rounded-l-[2rem] border-slate-700/70 bg-slate-900/96 backdrop-blur-2xl',
    closing() ? 'translate-x-full' : 'translate-x-0'
  ]"
  (click)="$event.stopPropagation()"
>
  <div
    class="pointer-events-none absolute inset-0"
    [ngClass]="theme() === 'light'
      ? 'bg-gradient-to-b from-white/70 to-transparent'
      : 'bg-gradient-to-b from-white/5 to-transparent'"
  ></div>
  <div
    class="relative shrink-0 border-b px-6 pb-4 pt-5"
    [ngClass]="theme() === 'light' ? 'border-sky-100 bg-sky-50/70' : 'border-slate-700 bg-slate-900/75'"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-[0.18em]" [ngClass]="theme() === 'light' ? 'text-slate-500' : 'text-slate-400'">
          {{ translate.t().layoutDrawerWorkspaceAction }}
        </p>
        <h2 class="mt-2 text-xl font-semibold tracking-tight" [ngClass]="theme() === 'light' ? 'text-slate-900' : 'text-slate-100'">
          {{ title() }}
        </h2>
      </div>
      <button
        type="button"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-xl transition-all duration-200 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-sky-400/35 focus-visible:ring-offset-2 focus-visible:ring-offset-transparent active:scale-95"
        [ngClass]="theme() === 'light' ? 'text-slate-500 hover:bg-white hover:text-slate-900 hover:shadow-lg' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-100 hover:shadow-lg'"
        (click)="close.emit()"
        [attr.aria-label]="translate.t().close"
      >
        <span class="material-symbols-outlined text-[22px]">close</span>
      </button>
    </div>
  </div>

  <div
    class="app-drawer-body relative min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-6 py-5"
    [ngClass]="theme() === 'light' ? 'bg-[#f7fbff]' : 'bg-slate-950'"
  >
    <ng-content />
  </div>

  <div class="relative shrink-0 border-t" [ngClass]="theme() === 'light' ? 'border-sky-100 bg-white/90' : 'border-slate-700 bg-slate-950/80'">
    <ng-content select="app-drawer-footer-actions" />
  </div>
</div>
