<div
  class="fixed inset-0 z-[9998] transition-all duration-300"
  [ngClass]="[
    theme() === 'light' ? 'bg-slate-900/40 backdrop-blur-[3px]' : 'bg-slate-950/60 backdrop-blur-[4px]',
    closing() ? 'opacity-0' : 'opacity-100'
  ]"
  (click)="close.emit()"
></div>
<div
  class="fixed right-0 top-0 z-[9999] flex h-screen max-h-[100dvh] w-full max-w-[560px] flex-col overflow-hidden border-l shadow-[0_30px_80px_-30px_rgba(2,6,23,0.65)] transition-transform duration-300"
  [ngClass]="[
    theme() === 'light' ? 'border-slate-200 bg-white' : 'border-slate-700/70 bg-slate-900',
    closing() ? 'translate-x-full' : 'translate-x-0'
  ]"
  (click)="$event.stopPropagation()"
>
  <div
    class="shrink-0 border-b px-6 pb-4 pt-5"
    [ngClass]="theme() === 'light' ? 'border-slate-200 bg-slate-50/70' : 'border-slate-700 bg-slate-900/75'"
  >
    <div class="flex items-start justify-between gap-4">
      <div>
        <p class="text-[11px] font-semibold uppercase tracking-[0.18em]" [ngClass]="theme() === 'light' ? 'text-slate-500' : 'text-slate-400'">
          {{ translate.t().layoutDrawerWorkspaceAction }}
        </p>
        <h2 class="mt-2 text-xl font-semibold tracking-tight" [ngClass]="theme() === 'light' ? 'text-slate-900' : 'text-slate-100'">
          {{ title() }}
        </h2>
      </div>
      <button
        type="button"
        class="flex h-11 w-11 shrink-0 items-center justify-center rounded-lg transition"
        [ngClass]="theme() === 'light' ? 'text-slate-500 hover:bg-white hover:text-slate-900' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-100'"
        (click)="close.emit()"
        [attr.aria-label]="translate.t().close"
      >
        <span class="material-symbols-outlined text-[22px]">close</span>
      </button>
    </div>
  </div>

  <div
    class="app-drawer-body min-h-0 flex-1 overflow-y-auto overflow-x-hidden px-6 py-5"
    [ngClass]="theme() === 'light' ? 'bg-slate-100/90' : 'bg-slate-950'"
  >
    <ng-content />
  </div>

  <div class="shrink-0 border-t" [ngClass]="theme() === 'light' ? 'border-slate-200' : 'border-slate-700'">
    <ng-content select="app-drawer-footer-actions" />
  </div>
</div>
