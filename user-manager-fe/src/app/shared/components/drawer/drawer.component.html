<div class="overlay-backdrop transition-opacity duration-200" [class.opacity-0]="closing()" (click)="close.emit()" aria-hidden="true"></div>
<aside class="drawer-panel transition-transform duration-200" [class.translate-x-full]="closing()" role="dialog" aria-modal="true" [attr.aria-label]="title()" (click)="$event.stopPropagation()">
  <header class="flex shrink-0 items-start justify-between gap-4 border-b border-line px-6 py-4">
    <div class="min-w-0">
      @if (subtitle()) { <p class="eyebrow">{{ subtitle() }}</p> }
      <h2 class="mt-0.5 truncate text-base font-semibold">{{ title() }}</h2>
    </div>
    <button type="button" class="btn-icon -mr-2" (click)="close.emit()" [attr.aria-label]="translate.t().close">
      <span class="material-symbols-outlined">close</span>
    </button>
  </header>
  <div class="app-drawer-body min-h-0 flex-1 overflow-y-auto px-6 py-5">
    <ng-content />
  </div>
  <ng-content select="app-drawer-footer-actions" />
</aside>
