<div class="pointer-events-none fixed inset-x-4 bottom-4 z-[100] flex flex-col items-end gap-2 sm:inset-x-auto sm:right-5 sm:bottom-5 sm:w-[24rem]"
     role="region" aria-live="polite" aria-label="Notifications">
  @for (n of notifications(); track n.id) {
    <div class="pointer-events-auto flex w-full items-start gap-3 rounded-xl border border-line bg-surface px-4 py-3 text-sm shadow-pop transition-all duration-200"
         [class.opacity-0]="n.leaving" [class.translate-y-1]="n.leaving" [class.animate-fade-up]="!n.leaving"
         [attr.role]="n.type === 'error' ? 'alert' : 'status'">
      <span class="material-symbols-outlined icon-fill mt-px text-[20px]" [class]="toneClass(n.type)">{{ iconFor(n.type) }}</span>
      <p class="min-w-0 flex-1 leading-snug text-fg">{{ n.message }}</p>
      <button type="button" class="btn-icon-sm -mr-1.5 -mt-1" (click)="dismiss(n.id)" aria-label="Dismiss">
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    </div>
  }
</div>
