<div #hostRoot class="app-dropdown relative w-full">
  <button #triggerBtn type="button"
    class="input flex items-center justify-between gap-2 text-left"
    [ngClass]="open() ? 'border-brand ring-4 ring-brand/15' : ''"
    [disabled]="isDisabled()" (click)="toggle()" [attr.aria-expanded]="open()" aria-haspopup="listbox">
    <span class="truncate" [class.text-fg-3]="!selectedLabel">{{ selectedLabel || placeholder() }}</span>
    <span class="material-symbols-outlined text-[18px] text-fg-3 transition-transform duration-150" [class.rotate-180]="open()">expand_more</span>
  </button>

  <!-- Panel is temporarily moved to document.body while open (ancestors with transforms break position:fixed). -->
  <div #dropdownPanel role="listbox" [hidden]="!open()"
    class="app-dropdown-panel fixed z-[10050] min-w-0 overflow-y-auto overscroll-contain rounded-xl border border-line bg-surface p-1 shadow-pop animate-scale-in"
    [ngStyle]="panelStyle() ?? {}">
    @for (opt of options(); track opt.value) {
      <button type="button" role="option" [attr.aria-selected]="value() === opt.value"
        class="flex w-full items-center justify-between gap-2 rounded-lg px-2.5 py-2 text-left text-sm transition-colors"
        [class]="value() === opt.value ? 'bg-brand-soft text-brand-text' : (opt.value ? 'text-fg hover:bg-surface-2' : 'text-fg-3 hover:bg-surface-2')"
        (click)="select(opt)">
        <span class="truncate">{{ opt.label }}</span>
        @if (value() === opt.value) { <span class="material-symbols-outlined text-[18px]">check</span> }
      </button>
    } @empty {
      <div class="px-3 py-2.5 text-sm text-fg-3">{{ translate.t().noOptions }}</div>
    }
  </div>
</div>
